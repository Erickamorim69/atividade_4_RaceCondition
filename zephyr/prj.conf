# Habilita o subsistema de Logging do Zephyr
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Habilita suporte a GPIO para o LED RGB
CONFIG_GPIO=y

# Habilita suporte a Multithreading e k_thread_join
CONFIG_MULTITHREADING=y

# Habilita formatação de ponto flutuante no LOG (para exibir a taxa de perda em %)
CONFIG_CBPRINTF_FP_SUPPORT=y